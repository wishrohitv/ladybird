# .github/workflows/appimage-debian12.yml
name: Build Ladybird AppImage (Debian 12)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Ladybird git ref (branch, tag or commit)"
        required: false
        default: "master"
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    container:
      image: debian:12
    env:
      DEBIAN_FRONTEND: noninteractive
      APPIMAGE_EXTRACT_AND_RUN: "1"   # AppImage tools run without FUSE in CI
      LADYBIRD_REF: ${{ inputs.ref || 'master' }}
      CC: clang-18
      CXX: clang++-18

    steps:
      - name: Install base packages
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl wget gnupg git file pkg-config \
            cmake ninja-build python3 nasm ccache \
            libfuse2 desktop-file-utils

      - name: Install LLVM/Clang 18 (Debian 12 ships clang 14, too old)
        run: |
          wget -qO- https://apt.llvm.org/llvm.sh | bash -s -- 18
          apt-get install -y --no-install-recommends clang-18 lld-18

      - name: Install Ladybird build dependencies
        run: |
          apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-base-dev-tools \
            libgl-dev libegl-dev libgbm-dev libdrm-dev libxkbcommon-dev \
            libvulkan-dev libxcb1-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev \
            libcurl4-openssl-dev libfreetype-dev libharfbuzz-dev \
            libicu-dev libjpeg-dev libpng-dev libwebp-dev libopus-dev \
            libsqlite3-dev libxml2-dev zlib1g-dev
          # Compare with Meta/ or Documentation/ in the Ladybird repo and adjust.

      - name: Checkout Ladybird
        uses: actions/checkout@v4
        with:
          repository: LadybirdBrowser/ladybird
          ref: ${{ env.LADYBIRD_REF }}
          submodules: recursive
          fetch-depth: 0
          path: ladybird

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ladybird-ccache-debian12-${{ env.LADYBIRD_REF }}-${{ github.run_id }}
          restore-keys: ladybird-ccache-debian12-

      - name: Configure
        working-directory: ladybird
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=clang-18 \
            -DCMAKE_CXX_COMPILER=clang++-18 \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DENABLE_QT=ON

      - name: Build
        working-directory: ladybird
        run: cmake --build build --parallel "$(nproc)"

      - name: Install into AppDir
        working-directory: ladybird
        run: |
          cmake --install build --prefix "$GITHUB_WORKSPACE/AppDir/usr"

      - name: Create desktop entry and icon
        run: |
          mkdir -p AppDir/usr/share/applications AppDir/usr/share/icons/hicolor/256x256/apps
          cat > AppDir/ladybird.desktop <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Ladybird
          Comment=Ladybird web browser
          Exec=Ladybird %U
          Icon=ladybird
          Terminal=false
          Categories=Network;WebBrowser;
          MimeType=text/html;x-scheme-handler/http;x-scheme-handler/https;
          EOF
          cp AppDir/ladybird.desktop AppDir/usr/share/applications/
          # Replace this path with the real icon in the repo (find it with: find ladybird -name "*.png" | grep -i icon)
          cp "$(find ladybird -iname '*256*.png' | head -n1)" AppDir/usr/share/icons/hicolor/256x256/apps/ladybird.png
          cp AppDir/usr/share/icons/hicolor/256x256/apps/ladybird.png AppDir/ladybird.png

      - name: Fetch linuxdeploy and Qt plugin
        run: |
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage
          chmod +x linuxdeploy-*.AppImage

      - name: Build AppImage
        run: |
          VERSION="$(git -C ladybird describe --tags --always 2>/dev/null || git -C ladybird rev-parse --short HEAD)"
          export VERSION
          export OUTPUT="Ladybird-${VERSION}-x86_64.AppImage"
          export QT_QPA_PLATFORM=offscreen
          ./linuxdeploy-x86_64.AppImage \
            --appdir AppDir \
            --executable AppDir/usr/bin/Ladybird \
            --desktop-file AppDir/ladybird.desktop \
            --icon-file AppDir/ladybird.png \
            --plugin qt \
            --output appimage
          mv Ladybird-*.AppImage ./Ladybird-x86_64.AppImage
          sha256sum Ladybird-x86_64.AppImage > Ladybird-x86_64.AppImage.sha256

      - name: Smoke test
        run: |
          ./Ladybird-x86_64.AppImage --version || true
          ldd AppDir/usr/bin/Ladybird | grep "not found" && exit 1 || echo "All shared libs resolved"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-AppImage-debian12
          path: |
            Ladybird-x86_64.AppImage
            Ladybird-x86_64.AppImage.sha256

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Ladybird-x86_64.AppImage
            Ladybird-x86_64.AppImage.sha256
